name: CAXA helper tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app runtime devtools
      - name: Run unit tests
        run: python -m unittest discover -s devtools/tests -v

  ahk-syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download and verify portable AutoHotkey v2
        shell: pwsh
        run: |
          $archive = Join-Path $env:TEMP "AutoHotkey_2.0.32.zip"
          $extract = Join-Path $env:TEMP "AutoHotkey_2.0.32"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.32/AutoHotkey_2.0.32.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "384a4c125e8d7b5b77ddbd5a593ec761d3e9e96e97a95931cf56e9a077fda114"
          if ($actual -ne $expected) { throw "AutoHotkey archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $exe = Join-Path $extract "AutoHotkey64.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Verified AutoHotkey64.exe not found in official archive" }
          $scripts = @(
            (Join-Path $env:GITHUB_WORKSPACE "app\快捷键工具\CAXA_半自动辅助.ahk"),
            (Join-Path $env:GITHUB_WORKSPACE "app\快捷键工具\CAXA_控件探针_只读.ahk")
          )
          foreach ($script in $scripts) {
            $stdout = Join-Path $env:TEMP (([IO.Path]::GetFileName($script)) + ".stdout.txt")
            $stderr = Join-Path $env:TEMP (([IO.Path]::GetFileName($script)) + ".stderr.txt")
            $process = Start-Process -FilePath $exe -ArgumentList @($script, "--syntax-check") -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            if ($process.ExitCode -ne 0) { throw "AutoHotkey v2 parse check failed for $script with exit code $($process.ExitCode)" }
          }

  portable-test-package:
    needs: [tests, ahk-syntax]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Download and verify AutoHotkey runtime for the package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "AutoHotkey_2.0.32.zip"
          $extract = Join-Path $env:RUNNER_TEMP "AutoHotkey_2.0.32-package"
          $vendor = Join-Path $env:RUNNER_TEMP "AHK_Runtime"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.32/AutoHotkey_2.0.32.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "384a4c125e8d7b5b77ddbd5a593ec761d3e9e96e97a95931cf56e9a077fda114"
          if ($actual -ne $expected) { throw "AutoHotkey archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          foreach ($name in @("AutoHotkey64.exe", "AutoHotkey32.exe")) {
            $source = Get-ChildItem -LiteralPath $extract -Filter $name -Recurse | Select-Object -First 1
            if ($source) { Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $vendor $name) }
          }
          $license = Get-ChildItem -LiteralPath $extract -Filter "license.txt" -Recurse | Select-Object -First 1
          if (!$license) { $license = Get-ChildItem -LiteralPath $extract -Filter "LICENSE.txt" -Recurse | Select-Object -First 1 }
          if (!$license) { throw "AutoHotkey license.txt was not found in the verified archive" }
          Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $vendor "license.txt")
          if (!(Test-Path (Join-Path $vendor "AutoHotkey64.exe"))) { throw "AutoHotkey64.exe missing from verified archive" }
      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "CAXA助手" --distpath "build\pyinstaller\dist" --workpath "build\pyinstaller\work" --specpath "build\pyinstaller\spec" --add-data "app;app" --add-data "runtime;runtime" --hidden-import=tkinter --hidden-import=tkinter.ttk --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --hidden-import=tkinter.simpledialog --hidden-import=tkinter.font --hidden-import=tkinter.colorchooser --hidden-import=_tkinter runtime\launcher.py
          if (!(Test-Path "build\pyinstaller\dist\CAXA助手\CAXA助手.exe")) { throw "PyInstaller executable was not created" }
      - name: Build isolated ZIP and smoke-test bundled runtimes
        shell: pwsh
        run: |
          python devtools/release/build_test_package.py --output-dir dist --portable-dir "build/pyinstaller/dist/CAXA助手" --ahk-runtime-dir "$env:RUNNER_TEMP\AHK_Runtime"
          $zip = Get-ChildItem -LiteralPath dist -Filter "*.zip" | Select-Object -First 1
          if (!$zip) { throw "Portable test ZIP was not created" }
          $smoke = Join-Path $env:RUNNER_TEMP "CAXA_Portable_Smoke"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $smoke -Force
          $package = Get-ChildItem -LiteralPath $smoke -Directory | Select-Object -First 1
          $env:CAXA_INSTALL_ROOT = $package.FullName
          $env:CAXA_HELPER_DATA_DIR = Join-Path $env:RUNNER_TEMP "CAXA_Portable_Smoke_Data"
          $exe = Join-Path $package.FullName "program\CAXA助手.exe"
          & $exe --smoke-tk
          if ($LASTEXITCODE -ne 0) { throw "Bundled Tk/Tcl smoke test failed: $LASTEXITCODE" }
          & $exe --smoke-ahk
          if ($LASTEXITCODE -ne 0) { throw "Bundled AutoHotkey runtime smoke test failed: $LASTEXITCODE" }
          & $exe --check-job ("0" * 64)
          if ($LASTEXITCODE -ne 1) { throw "Headless verifier dispatch failed: $LASTEXITCODE" }
      - name: Upload portable test package
        uses: actions/upload-artifact@v4
        with:
          name: CAXA-Library-Helper-v0.42.17-Portable-Test
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
